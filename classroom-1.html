<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
    />
    <title>전화영어 클래스룸</title>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap"
    />
    <style>
      /* ===== Tokens (Role Based Color) ===== */
      :root {
        /* brand */
        --purple: #6d42bf;
        --purple-dark: #4c2e96;
        --purple-deep: #241246;
        --marker-idle: #4e2f99;
        --purple-tint: #f4eeff;
        --selection-bg: #e0e7ff;
        /* text */
        --ink: #1c1917;
        --sub: #6b655f;
        --sub2: #8a8580;
        /* surface */
        --bg: #f4f6fb;
        --header-bg: #ffffff;
        --card: #ffffff;
        --surface-subtle: #f8f7fb;
        /* border */
        --line: #caafff;
        --line-soft: #f1eff9;
        /* tone */
        --mint-bg: #dcf5ec;
        --mint-text: #037a55;
        --badge-1: #533099;
        --badge-2: #533099;
        /* elevation */
        --shadow-card: 0 10px 26px -12px rgba(76, 46, 150, 0.16);
        --shadow-btn: 0 14px 26px -10px rgba(76, 46, 150, 0.55);
        --r-card: 20px;
        --r-pill: 999px;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --ink: #f3f1fa;
          --sub: #c7c1d6;
          --sub2: #9e97b3;
          --bg: #131019;
          --header-bg: #1b1726;
          --card: #1e1a2c;
          --surface-subtle: #241f35;
          --line: #332c49;
          --line-soft: #2a2438;
          --mint-bg: #123328;
          --mint-text: #4ade9c;
          --purple-tint: #2b1f52;
          --selection-bg: #332b5c;
          --shadow-card: 0 10px 26px -12px rgba(0, 0, 0, 0.5);
        }
      }
      :root[data-theme="dark"] {
        --ink: #f3f1fa;
        --sub: #c7c1d6;
        --sub2: #9e97b3;
        --bg: #131019;
        --header-bg: #1b1726;
        --card: #1e1a2c;
        --surface-subtle: #241f35;
        --line: #332c49;
        --line-soft: #2a2438;
        --mint-bg: #123328;
        --mint-text: #4ade9c;
        --purple-tint: #2b1f52;
        --selection-bg: #332b5c;
        --shadow-card: 0 10px 26px -12px rgba(0, 0, 0, 0.5);
      }

      * {
        box-sizing: border-box;
      }
      body {
        background: var(--bg);
        color: var(--ink);
        font-family:
          "Noto Sans KR",
          "Pretendard",
          -apple-system,
          sans-serif;
      }
      img {
        max-width: 100%;
        display: block;
      }
      button {
        font-family: inherit;
        border: none;
        background: none;
        cursor: pointer;
        color: inherit;
      }
      h1,
      h2,
      h3,
      h4,
      p {
        margin: 0;
        text-wrap: balance;
      }
      .num {
        font-family: "Plus Jakarta Sans", "Noto Sans KR", sans-serif;
        font-variant-numeric: tabular-nums;
      }

      .rc-app {
        max-width: 390px;
        margin: 0 auto;
        min-height: 100%;
        display: flex;
        flex-direction: column;
        background: var(--bg);
      }

      /* ---------- Header ---------- */
      /* ---------- Header ---------- */
      .rc-topbar {
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        align-items: center;
        gap: 8px;
        padding: 14px 16px;
        background: var(--header-bg);
        border-bottom: 1px solid var(--line-soft);
      }
      .rc-logo {
        display: flex;
        align-items: center;
        gap: 7px;
        min-width: 0;
        justify-self: start;
      }
      .rc-logo-img {
        height: 26px;
        width: auto;
        flex: none;
      }
      /* 로고 이미지 로드 실패 시 대비용 대체 마크 — 실제 이미지 경로가 확정되면 .rc-logo-fallback 블록은 삭제 가능 */
      .rc-logo-fallback {
        display: none;
        align-items: flex-end;
        gap: 2px;
        height: 22px;
        flex: none;
      }
      .rc-logo-fallback .y {
        width: 8px;
        height: 22px;
        background: #e31c3d;
        border-radius: 3px 3px 0 0;
        transform: skewX(-6deg);
      }
      .rc-logo-fallback .b1 {
        width: 4px;
        height: 18px;
        background: #16296b;
      }
      .rc-logo-fallback .b2 {
        width: 4px;
        height: 22px;
        background: #16296b;
      }
      .rc-logo-fallback .b3 {
        width: 4px;
        height: 14px;
        background: #16296b;
      }

      .rc-topbar-title {
        font-size: 17px;
        font-weight: 800;
        color: var(--ink);
        white-space: nowrap;
        justify-self: center;
      }

      .rc-topbar-info {
        font-size: 12.5px;
        font-weight: 700;
        color: var(--purple);
        display: flex;
        align-items: center;
        gap: 1px;
        white-space: nowrap;
        padding: 3px 2px;
        margin-top: 1px;
        justify-self: end;
        font-family: inherit;
        border: none;
        background: none;
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
      }
      .rc-topbar-info svg {
        width: 12px;
        height: 12px;
        margin-top: 1px;
      }
      .rc-topbar-info:active {
        opacity: 0.6;
      }

      .rc-tabs {
        position: relative;
        display: flex;
        background: var(--header-bg);
        border-bottom: 1px solid var(--line-soft);
        padding: 0 16px;
      }
      .rc-tabs button {
        flex: 1;
        padding: 12px 4px 13px;
        font-size: 13.5px;
        font-weight: 700;
        color: var(--sub2);
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 5px;
        transition: color 0.15s;
        font-family: inherit;
        border: none;
        background: none;
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
      }
      .rc-tabs button .c {
        font-size: 11px;
        font-weight: 700;
        color: var(--sub2);
      }
      .rc-tabs button.on {
        color: var(--ink);
      }
      .rc-tabs button.on .c {
        color: var(--purple);
      }
      .rc-tabs .ind {
        position: absolute;
        left: 16px;
        bottom: -1px;
        height: 2.5px;
        width: calc((100% - 32px) / 3);
        background: linear-gradient(90deg, var(--purple), var(--purple-dark));
        border-radius: 2px;
        transition: transform 0.22s cubic-bezier(0.4, 0, 0.2, 1);
      }

      .rc-body {
        flex: 1;
        padding: 14px 16px calc(90px + env(safe-area-inset-bottom, 0px));
        display: flex;
        flex-direction: column;
        gap: 16px;
      }

      /* ---------- Tutor card ---------- */
      .rc-tutor {
        background: var(--card);
        border-radius: 18px;
        padding: 12px 14px 13px;
        display: flex;
        flex-direction: column;
        gap: 10px;
        box-shadow: var(--shadow-card);
      }
      .rc-tutor-row {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .rc-tutor-avatar {
        width: 42px;
        height: 42px;
        border-radius: 50%;
        flex: none;
        color: #fff;
        font-weight: 700;
        font-size: 14px;
        display: flex;
        align-items: center;
        justify-content: center;
        letter-spacing: 0.3px;
        background: linear-gradient(150deg, #8e7bef, #5b3fbe);
      }
      .rc-tutor-info {
        flex: 1;
        min-width: 0;
      }
      .rc-tutor-info .name {
        font-size: 15px;
        font-weight: 700;
        color: var(--ink);
        line-height: 1.3;
      }
      .rc-tutor-info .name b {
        font-weight: 500;
        color: var(--sub);
        margin-left: 2px;
      }
      .rc-tutor-info .role {
        font-size: 12px;
        color: var(--sub);
        line-height: 1.3;
        margin-top: 2px;
      }
      .rc-cal-btn {
        width: 36px;
        height: 36px;
        border-radius: 50%;
        flex: none;
        color: #fff;
        background: linear-gradient(150deg, var(--purple), var(--purple-dark));
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: var(--shadow-btn);
      }
      .rc-cal-btn svg {
        width: 16px;
        height: 16px;
      }
      /* 다른 수강 중인 강의로 넘어가는 페이징(캐러셀 dot) — 진행률이 아니라 "여러 강의 중 몇 번째"를 나타냄, 그래서 모두 같은 크기의 점으로 표현.
     카드 전체를 좌우로 스와이프해도 같은 방식으로 넘어간다. */
      .rc-progress {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 7px;
      }
      .rc-progress button {
        width: 7px;
        height: 7px;
        padding: 0;
        border-radius: 50%;
        background: var(--selection-bg);
        transition:
          background 0.15s,
          transform 0.15s;
      }
      .rc-progress button.on {
        background: var(--purple);
      }
      .rc-progress button:active {
        transform: scale(1.2);
      }

      /* ---------- Hero card ---------- */
      /* 캐릭터 영상은 '정보'가 아니라 '감성/브랜드' 요소 — 행동에 필요한 정보(시간·CTA)보다 면적이 커지지 않도록
     비율을 넓고 낮게 잡아 캐릭터를 시각적으로 낮춘다. */
      .rc-hero {
        background: var(--card);
        border-radius: 18px;
        padding: 14px;
        box-shadow: var(--shadow-card);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
      }
      .rc-hero-top {
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }
      .rc-hero-tag {
        font-size: 11px;
        font-weight: 700;
        color: var(--mint-text);
        background: var(--mint-bg);
        padding: 5px 11px;
        border-radius: var(--r-pill);
      }
      /* 환경 테스트: 수업 입장 전 카메라/마이크 점검 진입점. 현재는 디자인 검토용으로 4가지 수업 상태
     (예정/임박/진행중/종료)를 순환 미리보기하는 동작이 연결되어 있음 — 실제 기능 연결 시 교체 필요 */
      .rc-hero-preview {
        font-size: 10.5px;
        font-weight: 600;
        color: var(--sub2);
        text-decoration: underline;
        text-underline-offset: 2px;
      }
      .rc-hero-media {
        width: 100%;
        aspect-ratio: 3/1;
        border-radius: 14px;
        overflow: hidden;
        background: #fff;
        position: relative;
        transition: opacity 0.25s ease;
      }
      .rc-hero-media video {
        width: 100%;
        height: 100%;
        object-fit: contain;
        background: #fff;
      }
      .rc-hero-media.is-ended {
        opacity: 0.55;
      }

      /* 상태별 색상 : 보라=행동(CTA 전용), 회색/잉크=정보, 민트=진행중 상태 → 예정/임박은 중립톤으로 */
      .rc-hero-status {
        display: flex;
        align-items: baseline;
        gap: 7px;
        justify-content: center;
        color: var(--ink);
      }
      .rc-hero-status[data-state="soon"] {
        color: var(--ink);
      }
      .rc-hero-status[data-state="live"] {
        color: var(--mint-text);
      }
      .rc-hero-status[data-state="ended"] {
        color: var(--sub2);
      }
      .rc-hero-status svg {
        width: 18px;
        height: 18px;
        align-self: center;
        margin-right: -2px;
      }
      .rc-hero-status .num {
        font-size: 22px;
        font-weight: 800;
        letter-spacing: 0.5px;
      }
      .rc-hero-status .suffix,
      .rc-hero-status .txt {
        font-size: 13px;
        font-weight: 600;
        color: var(--sub);
      }
      .rc-hero-status[data-state="live"] .txt {
        color: var(--mint-text);
        font-weight: 700;
      }
      .rc-hero-status[data-state="ended"] .txt {
        color: var(--sub2);
        font-weight: 700;
      }
      .rc-live-dot {
        position: relative;
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: var(--mint-text);
        flex: none;
      }
      .rc-live-dot::after {
        content: "";
        position: absolute;
        inset: -4px;
        border-radius: 50%;
        background: var(--mint-text);
        opacity: 0.4;
        animation: rcLivePulse 1.4s ease-out infinite;
      }
      @keyframes rcLivePulse {
        0% {
          transform: scale(0.5);
          opacity: 0.5;
        }
        100% {
          transform: scale(2.1);
          opacity: 0;
        }
      }

      .rc-hero-title {
        font-size: 16px;
        font-weight: 700;
        color: var(--ink);
        text-align: center;
      }
      .rc-hero-cta {
        width: 100%;
        padding: 13px 18px;
        border-radius: 14px;
        color: #fff;
        font-size: 14px;
        font-weight: 700;
        background: linear-gradient(
          120deg,
          var(--purple) 0%,
          var(--purple-dark) 100%
        );
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 7px;
        box-shadow: var(--shadow-btn);
      }
      .rc-hero-cta svg {
        width: 15px;
        height: 15px;
      }
      .rc-hero-cta:active {
        transform: translateY(1px);
        filter: brightness(0.97);
      }
      .rc-hero-cta.is-ended {
        background: linear-gradient(120deg, #8a8580 0%, #6b655f 100%);
        box-shadow: none;
      }

      /* ---------- Section heading : 강/약 위계 ---------- */
      /* 타이틀-콘텐츠 간격: "타이틀과 그 위 콘텐츠 사이"는 margin-top으로 32px 균일하게,
     "타이틀과 그 아래 자기 내용" 사이는 gap 10px로 타이틀이 자기 내용에 붙도록 유지 */
      .rc-block {
        display: flex;
        flex-direction: column;
        gap: 10px;
        margin-top: 16px;
      } /* .rc-body의 gap 16px + 여기 16px = 위쪽 총 32px */
      .rc-block-title {
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      .rc-block-title .eyebrow {
        font-size: 12px;
        font-weight: 600;
        color: var(--sub);
        letter-spacing: 0.1px;
      }
      .rc-block-title .headline {
        font-size: 18px;
        font-weight: 800;
        color: var(--ink);
        line-height: 1.3;
        letter-spacing: -0.3px;
      }
      /* "해야 한다"는 압박감이 들지 않도록 가볍게 안내하는 한 줄 — 예습이 필수 체크리스트처럼 보이지 않게 톤을 낮춘다 */

      /* ---------- Diagram card : 3단계 예습 플로우 (고정 위치, 클릭 시 크기만 확대/축소) ---------- */
      .rc-diagram {
        background: var(--card);
        border-radius: 18px;
        box-shadow: var(--shadow-card);
        position: relative;
        overflow: hidden;
        padding: 22px 14px 24px;
      }
      .rc-flow {
        position: relative;
        display: flex;
        flex-direction: column;
      }
      .rc-flow svg.link {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        overflow: visible;
        pointer-events: none;
      }
      /* 순서(flow)가 아니라 "선택 가능한 준비 메뉴"라는 인상을 주기 위해 선을 30~40% 더 약하게 낮춘다 */
      .rc-flow svg.link path {
        fill: none;
        stroke: var(--purple);
        stroke-width: 2;
        stroke-dasharray: 5 7;
        opacity: 0.28;
      }

      /* 각 단계는 항상 같은 순서·같은 자리를 지킨다 — 클릭해도 위치는 그대로, 크기만 바뀐다.
     좌/우 정렬 오프셋은 마커·라벨에만 마진으로 주고 .rc-step 자체에는 패딩을 주지 않는다 —
     그래야 팝업(너비 100%)이 정렬과 무관하게 항상 카드 전체 폭을 꽉 채운다. */
      .rc-step {
        position: relative;
        display: flex;
        flex-direction: column;
      }
      .rc-step + .rc-step {
        margin-top: 16px;
      }
      .rc-step[data-align="center"] {
        align-items: center;
      }
      .rc-step[data-align="right"] {
        align-items: flex-end;
      }
      .rc-step[data-align="left"] {
        align-items: flex-start;
      }
      .rc-step[data-align="right"] .rc-step-marker,
      .rc-step[data-align="right"] .rc-step-label {
        margin-right: 13%;
      }
      .rc-step[data-align="left"] .rc-step-marker,
      .rc-step[data-align="left"] .rc-step-label {
        margin-left: 9%;
      }

      .rc-step-marker {
        position: relative;
        width: 100px;
        height: 100px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(
          --marker-idle
        ); /* 그라데이션 없이 단색 — 기본(닫힌) 상태 */
        box-shadow: 0 8px 16px -8px rgba(40, 20, 90, 0.4);
        flex: none;
        transition:
          width 0.28s ease,
          height 0.28s ease,
          background 0.2s ease;
      }
      .rc-step-marker img {
        width: 82%;
        height: auto;
      }
      .rc-step[data-active="true"] .rc-step-marker {
        width: 120px;
        height: 120px;
        background: var(--purple-deep);
      }
      .rc-step-marker:hover {
        filter: brightness(1.08);
      }
      /* 완료 뱃지 — 완료한 단계에만 표시 */
      .rc-step-badge-done {
        position: absolute;
        top: -3px;
        right: -3px;
        width: 24px;
        height: 24px;
        border-radius: 50%;
        background: var(--mint-text);
        border: 2px solid #fff;
        box-shadow: 0 2px 6px -2px rgba(0, 0, 0, 0.35);
        display: none;
        align-items: center;
        justify-content: center;
        color: #fff;
      }
      .rc-step[data-completed="true"] .rc-step-badge-done {
        display: flex;
      }
      .rc-step-badge-done svg {
        width: 13px;
        height: 13px;
      }

      .rc-step-label {
        margin-top: 7px;
        font-size: 11px;
        font-weight: 700;
        color: #fff;
        background: var(--marker-idle);
        padding: 4px 9px;
        border-radius: var(--r-pill);
        white-space: nowrap;
      }
      .rc-step[data-active="true"] .rc-step-label {
        display: none;
      }

      /* 말풍선처럼 마커 '아래'에서 카드 폭을 꽉 채우며 나타나는 팝업. 모두 1단계(레슨) 팝업 높이에 맞춰 JS로 동일한 min-height를 부여받고,
     내용이 짧은 팝업은 세로 중앙정렬로 빈 공간을 채운다. 위쪽엔 캐릭터를 향한 말풍선 꼬리(.rc-popup-tail)가 붙는다. */
      .rc-step-popup {
        display: none;
        position: relative;
        width: 100%;
        margin-top: -16px;
        background: linear-gradient(
          150deg,
          #7c51d6 0%,
          var(--purple-dark) 100%
        );
        border-radius: 16px;
        padding: 13px 16px;
        box-shadow: 0 18px 30px -14px rgba(50, 25, 110, 0.5);
        text-align: center;
        flex-direction: column;
        justify-content: center;
        box-sizing: border-box;
      }
      .rc-step[data-active="true"] .rc-step-popup {
        display: flex;
      }
      /* 꼬리는 팝업과 동일한 그라데이션을 그대로 이어받아 색이 끊기지 않고 한 몸처럼 보인다 */
      .rc-popup-tail {
        position: absolute;
        top: -7px;
        left: 50%;
        width: 16px;
        height: 16px;
        background: linear-gradient(150deg, #7c51d6 0%, #6a44be 100%);
        transform: translateX(-50%) rotate(45deg);
      }
      .rc-step-popup .sub {
        font-size: 11px;
        font-weight: 500;
        color: rgba(255, 255, 255, 0.72);
        text-align: center;
      }

      /* 유닛 선택 드롭다운 — 닫혔을 땐 현재 회차만 텍스트로, 펼치면 목록이 박스로 나타난다 */
      .rc-unit-select {
        width: 100%;
        margin-top: 4px;
      }
      .rc-unit-toggle {
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 5px;
      }
      .rc-unit-toggle .unit-label {
        font-size: 15px;
        font-weight: 800;
        color: #fff;
      }
      .rc-unit-toggle svg {
        width: 14px;
        height: 14px;
        color: #fff;
        flex: none;
        transition: transform 0.18s ease;
      }
      .rc-unit-toggle[aria-expanded="true"] svg {
        transform: rotate(180deg);
      }
      .rc-unit-menu {
        display: flex;
        flex-direction: column;
        gap: 4px;
        background: rgba(255, 255, 255, 0.12);
        border-radius: 11px;
        padding: 5px;
        margin-top: 9px;
      }
      .rc-unit-menu[hidden] {
        display: none;
      }
      .rc-unit-menu button {
        padding: 8px 9px;
        border-radius: 8px;
        font-size: 12.5px;
        font-weight: 600;
        color: rgba(255, 255, 255, 0.85);
        text-align: center;
      }
      .rc-unit-menu button.cur {
        background: rgba(255, 255, 255, 0.18);
        color: #fff;
        font-weight: 700;
      }
      .rc-popup-go {
        display: block;
        width: 100%;
        margin-top: 10px;
        padding: 10px 8px;
        border-radius: 11px;
        font-size: 13px;
        font-weight: 700;
        text-align: center;
        background: #fff;
        color: var(--purple-dark);
      }
      .rc-popup-go:active {
        transform: scale(0.98);
      }
      /* 레슨 팝업 전용: 교재 보기 / 영상 보기 두 가지 액션을 나란히 노출 */
      .rc-popup-actions {
        display: flex;
        gap: 8px;
        margin-top: 10px;
      }
      .rc-popup-actions .rc-popup-go {
        margin-top: 0;
        flex: 1;
      }

      /* ---------- Pill list ---------- */
      .rc-pill-list {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .rc-pill-row {
        width: 100%;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 12px 14px;
        background: var(--purple-tint);
        border: 1px solid var(--line);
        border-radius: 14px;
      }
      .rc-pill-badge {
        width: 32px;
        height: 32px;
        border-radius: 10px;
        flex: none;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(150deg, var(--badge-1), var(--badge-2));
      }
      .rc-pill-badge img {
        width: 26px;
        height: auto;
      }
      .rc-pill-row .rc-pill-text {
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 2px;
        text-align: left;
        min-width: 0;
      }
      .rc-pill-row .label {
        font-size: 14px;
        font-weight: 700;
        color: var(--ink);
      }
      .rc-pill-row .desc {
        font-size: 11.5px;
        font-weight: 500;
        color: var(--sub2);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .rc-pill-row .go {
        font-size: 12px;
        font-weight: 700;
        color: #fff;
        background: linear-gradient(120deg, var(--purple), var(--purple-dark));
        padding: 6px 13px;
        border-radius: var(--r-pill);
        flex: none;
      }
      .rc-pill-row:active {
        filter: brightness(0.98);
      }

      /* ---------- Icon grid (질문하기 · AI 히스토리 · 만족도 평가 3종, 낮은 우선순위라 시각 무게 축소) ---------- */
      .rc-icon-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
      }
      .rc-icon-tile {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 7px;
        padding: 13px 6px;
        background: var(--card);
        border: 1px solid var(--line-soft);
        border-radius: 13px;
      }
      .rc-icon-tile svg {
        width: 19px;
        height: 19px;
        color: var(--sub2);
        flex: none;
      }
      .rc-icon-tile span {
        font-size: 12px;
        font-weight: 600;
        color: var(--sub);
        text-align: center;
      }
      .rc-icon-tile:active {
        transform: translateY(1px);
      }

      /* ---------- Bottom nav ---------- */
      .rc-bottom-nav {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 30;
        max-width: 430px;
        margin: 0 auto;
        display: flex;
        background: var(--card);
        border-top: 1px solid var(--line-soft);
        padding: 10px 24px calc(10px + env(safe-area-inset-bottom, 0px));
      }
      .rc-nav-item {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
        font-size: 12px;
        font-weight: 700;
        color: var(--sub2);
        white-space: nowrap;
      }
      .rc-nav-item svg {
        width: 23px;
        height: 23px;
      }
      .rc-nav-item.on {
        color: var(--purple);
      }

      /* ---------- Tablet / desktop (same as tablet) ---------- */
      @media (min-width: 640px) {
        body {
          padding-block: 28px;
        }
        .rc-app {
          max-width: 560px;
          border-radius: 28px;
          overflow: hidden;
          box-shadow: 0 30px 60px -30px rgba(30, 15, 70, 0.25);
        }
        .rc-bottom-nav {
          max-width: 560px;
        } /* position:sticky였을 때 .rc-app의 overflow:hidden/둥근 모서리에 잘려 배경이 끊겨 보이던 문제 — fixed 유지로 수정 */
        .rc-body {
          padding-inline: 28px;
        }
        .rc-hero-media {
          aspect-ratio: 30/9;
        }
        .rc-block-title .headline {
          font-size: 20px;
        }
        .rc-block-title .eyebrow {
          font-size: 13px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .rc-hero-cta,
        .rc-icon-tile,
        .rc-pill-row,
        .rc-step-marker,
        .rc-step-popup {
          transition: none;
        }
      }
    </style>
  </head>

    <script>
      (function () {
        "use strict";
        var reduceMotion =
          window.matchMedia &&
          window.matchMedia("(prefers-reduced-motion: reduce)").matches;
        var video = document.getElementById("heroVideo");
        if (video && reduceMotion) {
          video.removeAttribute("autoplay");
          video.pause();
        }

        /* 튜터 카드 페이징: 진행률이 아니라 "내가 수강 중인 다른 강의들" 사이 이동.
     하단 점 클릭뿐 아니라 카드 자체를 좌우로 스와이프해도 같은 방식으로 넘어간다. */
        var courses = [
          { initials: "SJ", name: "Sarah Jenkins", role: "비즈니스 실전 회화" },
          { initials: "DP", name: "Daniel Park", role: "데일리 프리토킹" },
          { initials: "EC", name: "Emily Cho", role: "여행 영어 회화" },
        ];
        var tutorCard = document.querySelector(".rc-tutor");
        var pager = document.getElementById("tutorPager");
        var avatarEl = document.getElementById("tutorAvatar");
        var nameEl = document.getElementById("tutorName");
        var roleEl = document.getElementById("tutorRole");
        var dots = Array.prototype.slice.call(pager.querySelectorAll("button"));
        var courseIndex = 0;

        function setCourse(i) {
          if (i < 0 || i >= courses.length || i === courseIndex) return;
          courseIndex = i;
          var c = courses[i];
          avatarEl.textContent = c.initials;
          nameEl.innerHTML = c.name + " <b>튜터</b>";
          roleEl.textContent = c.role;
          dots.forEach(function (d, j) {
            d.classList.toggle("on", j === i);
            d.setAttribute("aria-selected", j === i ? "true" : "false");
          });
        }
        dots.forEach(function (dot, i) {
          dot.addEventListener("click", function () {
            setCourse(i);
          });
        });

        /* 좌우 스와이프: 왼쪽으로 밀면 다음 강의, 오른쪽으로 밀면 이전 강의 */
        var touchStartX = null,
          touchStartY = null;
        tutorCard.addEventListener(
          "touchstart",
          function (e) {
            touchStartX = e.touches[0].clientX;
            touchStartY = e.touches[0].clientY;
          },
          { passive: true },
        );
        tutorCard.addEventListener("touchend", function (e) {
          if (touchStartX === null) return;
          var dx = e.changedTouches[0].clientX - touchStartX;
          var dy = e.changedTouches[0].clientY - touchStartY;
          touchStartX = null;
          if (Math.abs(dx) < 40 || Math.abs(dx) < Math.abs(dy)) return; // 짧거나 세로 위주의 움직임은 무시
          setCourse(dx < 0 ? courseIndex + 1 : courseIndex - 1);
        });

        /* 수업 상태 머신: 예정(upcoming) → 임박(soon, ≤60초) → 진행중(live) → 종료(ended).
     "00:00 남음"에서 멈추는 문제를 없애기 위해, 카운트다운이 끝나면 반드시 다음 상태로 넘어간다.
     LIVE_DURATION_SEC은 데모 확인을 위해 짧게 잡은 값 — 실서비스에서는 실제 수업 시간(예: 25분=1500)으로 교체한다. */
        var LIVE_DURATION_SEC = 20;
        var totalSeconds = 3 * 60 + 20; // 수업 시작까지 남은 시간(데모값)
        var liveElapsed = 0;
        var lessonState = "upcoming";

        var heroStatus = document.getElementById("heroStatus");
        var heroMedia = document.getElementById("heroMedia");
        var heroCta = document.getElementById("heroCta");
        var heroCtaLabel = heroCta.querySelector(".label");

        function mmss(sec) {
          var m = Math.floor(sec / 60),
            s = sec % 60;
          return String(m).padStart(2, "0") + ":" + String(s).padStart(2, "0");
        }

        function renderHero() {
          if (lessonState === "upcoming") {
            heroStatus.setAttribute("data-state", "upcoming");
            heroStatus.innerHTML =
              '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l3 2M9 2h6"/></svg>' +
              '<span class="num" id="countdown">' +
              mmss(totalSeconds) +
              '</span><span class="suffix">남음</span>';
            heroMedia.classList.remove("is-ended");
            heroCtaLabel.textContent = "강의실 바로 입장하기";
            heroCta.classList.remove("is-ended");
          } else if (lessonState === "soon") {
            heroStatus.setAttribute("data-state", "soon");
            heroStatus.innerHTML =
              '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l3 2M9 2h6"/></svg>' +
              '<span class="txt">잠시 후 시작</span>';
            heroMedia.classList.remove("is-ended");
            heroCtaLabel.textContent = "강의실 바로 입장하기";
            heroCta.classList.remove("is-ended");
          } else if (lessonState === "live") {
            heroStatus.setAttribute("data-state", "live");
            heroStatus.innerHTML =
              '<span class="rc-live-dot" aria-hidden="true"></span><span class="txt">지금 수업 중</span>';
            heroMedia.classList.remove("is-ended");
            heroCtaLabel.textContent = "지금 입장하기";
            heroCta.classList.remove("is-ended");
          } else {
            // ended
            heroStatus.setAttribute("data-state", "ended");
            heroStatus.innerHTML =
              '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>' +
              '<span class="txt">수업이 종료되었습니다</span>';
            heroMedia.classList.add("is-ended");
            heroCtaLabel.textContent = "수업 결과 확인하기";
            heroCta.classList.add("is-ended");
          }
        }

        function tick() {
          if (lessonState === "ended") return;
          if (totalSeconds > 60) {
            totalSeconds -= 1;
            lessonState = "upcoming";
          } else if (totalSeconds > 0) {
            totalSeconds -= 1;
            lessonState = "soon";
          } else if (liveElapsed < LIVE_DURATION_SEC) {
            liveElapsed += 1;
            lessonState = "live";
          } else {
            lessonState = "ended";
          }
          renderHero();
        }
        renderHero();
        var timerId = setInterval(tick, 1000);

        heroCta.addEventListener("click", function () {
          if (lessonState !== "ended") return;
          var target = document.getElementById("reviewSection");
          if (target)
            target.scrollIntoView({ behavior: "smooth", block: "start" });
        });

        /* 상태 미리보기(데모/QA 전용): 예정→임박→진행중→종료 순으로 강제 전환해 검토할 수 있게 한다 */
        var previewStates = [
          { totalSeconds: 200, liveElapsed: 0, lessonState: "upcoming" },
          { totalSeconds: 8, liveElapsed: 0, lessonState: "soon" },
          { totalSeconds: 0, liveElapsed: 0, lessonState: "live" },
          {
            totalSeconds: 0,
            liveElapsed: LIVE_DURATION_SEC,
            lessonState: "ended",
          },
        ];
        var previewIndex = 0;
        document
          .getElementById("statusPreview")
          .addEventListener("click", function () {
            previewIndex = (previewIndex + 1) % previewStates.length;
            var s = previewStates[previewIndex];
            totalSeconds = s.totalSeconds;
            liveElapsed = s.liveElapsed;
            lessonState = s.lessonState;
            renderHero();
          });

        /* 3단계 예습 플로우: 각 단계는 항상 같은 자리를 지키고, 클릭하면 크기만 커지고(활성) 나머지는 작아진다(톤다운).
     말풍선(팝업)은 항상 자신의 마커 '아래'에서 카드 폭을 꽉 채우며 나타나고, 꼬리가 마커를 향하며,
     크기는 1단계(레슨) 팝업 높이에 맞춰 통일된다. 점선 연결선은 캐릭터 '아래쪽'을 지나가도록 마커의 하단을 기준으로 그린다. */
        var flow = document.getElementById("flow");
        var steps = Array.prototype.slice.call(
          flow.querySelectorAll(".rc-step"),
        );
        var linkPath = flow.querySelector("svg.link path");

        function drawLink() {
          var flowRect = flow.getBoundingClientRect();
          if (!flowRect.width || !flowRect.height) return;
          var svg = flow.querySelector("svg.link");
          svg.setAttribute(
            "viewBox",
            "0 0 " + flowRect.width + " " + flowRect.height,
          );
          var points = steps.map(function (step) {
            var m = step.querySelector(".rc-step-marker");
            var r = m.getBoundingClientRect();
            // 마커의 '아래쪽 가장자리'를 기준점으로 잡아, 선이 캐릭터 아래를 지나가도록 한다
            return {
              x: r.left + r.width / 2 - flowRect.left,
              y: r.bottom - 4 - flowRect.top,
            };
          });
          var d = "M" + points[0].x.toFixed(1) + " " + points[0].y.toFixed(1);
          for (var i = 1; i < points.length; i++) {
            var prev = points[i - 1],
              cur = points[i],
              midY = (prev.y + cur.y) / 2;
            d +=
              " C " +
              prev.x.toFixed(1) +
              " " +
              midY.toFixed(1) +
              ", " +
              cur.x.toFixed(1) +
              " " +
              midY.toFixed(1) +
              ", " +
              cur.x.toFixed(1) +
              " " +
              cur.y.toFixed(1);
          }
          linkPath.setAttribute("d", d);
        }

        /* 모든 팝업의 높이를 "현재 열려 있는" 팝업 높이에 맞춘다 (처음엔 아무것도 안 열려 있으므로 그대로 둠).
     측정 전에 반드시 min-height를 먼저 비워야 한다 — 비우지 않으면 이전에 적용된 min-height가
     "바닥"으로 남아있어서, 드롭다운을 닫아 콘텐츠가 줄어도 measured height가 줄지 않고
     계속 키만 커지는(줄어들지 않는) 버그가 생긴다. */
        function syncPopupHeights() {
          steps.forEach(function (step) {
            step.querySelector(".rc-step-popup").style.minHeight = "";
          });
          var activeStep = steps.find(function (s) {
            return s.getAttribute("data-active") === "true";
          });
          if (!activeStep) return;
          var h = activeStep
            .querySelector(".rc-step-popup")
            .getBoundingClientRect().height;
          if (!h) return;
          steps.forEach(function (step) {
            step.querySelector(".rc-step-popup").style.minHeight = h + "px";
          });
        }

        /* 각 팝업의 꼬리를 자신의 캐릭터 쪽으로 이동 */
        function syncTails() {
          steps.forEach(function (step) {
            var popup = step.querySelector(".rc-step-popup");
            if (getComputedStyle(popup).display === "none") return;
            var marker = step.querySelector(".rc-step-marker");
            var mRect = marker.getBoundingClientRect();
            var pRect = popup.getBoundingClientRect();
            if (!pRect.width) return;
            var x = mRect.left + mRect.width / 2 - pRect.left;
            x = Math.max(22, Math.min(pRect.width - 22, x));
            popup.querySelector(".rc-popup-tail").style.left = x + "px";
          });
        }

        function refreshFlow() {
          drawLink();
          syncPopupHeights();
          syncTails();
        }

        function setActiveStep(id) {
          var clickedStep = steps.find(function (s) {
            return s.getAttribute("data-step-id") === id;
          });
          var wasActive =
            clickedStep && clickedStep.getAttribute("data-active") === "true";
          steps.forEach(function (step) {
            // 이미 열려 있는 걸 다시 클릭하면 닫는다(전부 닫힌 초기 상태로 되돌아갈 수 있게)
            step.setAttribute(
              "data-active",
              !wasActive && step.getAttribute("data-step-id") === id
                ? "true"
                : "false",
            );
          });
          refreshFlow();
          setTimeout(refreshFlow, 300); // 크기 전환(.28s)이 끝난 뒤 좌표 다시 계산
        }
        steps.forEach(function (step) {
          var marker = step.querySelector(".rc-step-marker");
          marker.addEventListener("click", function () {
            setActiveStep(step.getAttribute("data-step-id"));
          });
        });
        window.addEventListener("resize", refreshFlow);
        window.addEventListener("load", refreshFlow);
        refreshFlow();

        /* 완료 뱃지 — 팝업의 액션 버튼(교재보기/영상보기/AI 대화 시작)을 실제로 눌러야 그 단계가 "완료"로 표시된다 */
        steps.forEach(function (step) {
          step.querySelectorAll(".rc-popup-go").forEach(function (btn) {
            btn.addEventListener("click", function (e) {
              e.stopPropagation();
              step.setAttribute("data-completed", "true");
            });
          });
        });

        /* 유닛 선택 드롭다운 (팝업마다 1개씩 — 스크롤 목록 대신 "한 줄 + 펼치기") */
        document.querySelectorAll(".rc-unit-select").forEach(function (sel) {
          var toggle = sel.querySelector(".rc-unit-toggle");
          var menu = sel.querySelector(".rc-unit-menu");
          var labelEl = toggle.querySelector(".unit-label");
          toggle.addEventListener("click", function (e) {
            e.stopPropagation();
            var open = toggle.getAttribute("aria-expanded") === "true";
            toggle.setAttribute("aria-expanded", String(!open));
            menu.hidden = open;
            setTimeout(refreshFlow, 200); // 펼침으로 팝업 높이가 바뀌면 점선 좌표도 다시 계산
          });
          menu.querySelectorAll("button").forEach(function (btn) {
            btn.addEventListener("click", function (e) {
              e.stopPropagation();
              menu.querySelectorAll("button").forEach(function (b) {
                b.classList.remove("cur");
              });
              btn.classList.add("cur");
              labelEl.textContent = btn.getAttribute("data-unit");
              menu.hidden = true;
              toggle.setAttribute("aria-expanded", "false");
              setTimeout(refreshFlow, 200);
            });
          });
        });

        /* 하단 내비 탭 */
        document.querySelectorAll(".rc-nav-item").forEach(function (btn) {
          btn.addEventListener("click", function () {
            document.querySelectorAll(".rc-nav-item").forEach(function (b) {
              b.classList.remove("on");
              b.removeAttribute("aria-current");
            });
            btn.classList.add("on");
            btn.setAttribute("aria-current", "page");
          });
        });
      })();
    </script>
    <script>
      // 탭 전환 스크립트 — 헤더/탭 마크업과 함께 옮기면 됩니다.
      document.querySelectorAll("[data-rc-tabs]").forEach(function (group) {
        var buttons = Array.prototype.slice.call(
          group.querySelectorAll("button[data-i]"),
        );
        var ind = group.querySelector(".ind");
        buttons.forEach(function (btn) {
          btn.addEventListener("click", function () {
            buttons.forEach(function (b) {
              b.classList.remove("on");
            });
            btn.classList.add("on");
            ind.style.transform =
              "translateX(" + Number(btn.getAttribute("data-i")) * 100 + "%)";
          });
        });
      });
    </script>
  </body>
</html>
